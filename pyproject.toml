[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-forge"
version = "0.1.0"
description = "Photos and videos to an interactive offline Windows desktop pet"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Flask>=3.1,<4", "requests>=2.32,<3", "Pillow>=11,<13", "numpy>=2.2,<3", "imageio-ffmpeg>=0.6,<0.7"]

[project.scripts]
petforge = "petforge.__main__:main"

[tool.setuptools.packages.find]
include = ["petforge*"]

[tool.setuptools.package-data]
petforge = ["web/*"]
